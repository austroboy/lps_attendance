{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · LPS Attendance</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;">
  <div class="card" style="width:min(400px,92vw);">
    <h1 style="margin-bottom:2px;">LPS Attendance</h1>
    <p class="muted" style="margin-bottom:18px;">Sign in with the username your school gave you.</p>
    {% if form.errors %}
      <div class="notice error">That username and password do not match. Check both and try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {% include "_form.html" %}
      <button class="btn" type="submit" style="width:100%;">Sign in</button>
    </form>
  </div>
</body>
</html>
