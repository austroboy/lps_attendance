{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1>
<p>Pick something only you know. Six characters or more.</p></div></div>
<div class="card" style="max-width:560px;">
  <form method="post">{% csrf_token %}{% include "_form.html" %}

</div>
{% endblock %}
