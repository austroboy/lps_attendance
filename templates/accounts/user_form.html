{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1>
<p>A new user with no password set starts with their username as the password,
and is asked to change it on first sign-in.</p></div></div>
<div class="card" style="max-width:600px;">
  <form method="post">{% csrf_token %}{% include "_form.html" %}
    <div class="btn-row"><button class="btn" type="submit">Save user</button>
    <a class="btn ghost" href="{% url 'accounts:user_list' %}">Cancel</a></div></form>
</div>
{% endblock %}
